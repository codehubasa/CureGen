<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CureGen AI Pregnancy Guide</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI;
}

body{
background:
radial-gradient(circle at 10% 10%, rgba(0,255,200,0.25), transparent 40%),
radial-gradient(circle at 90% 80%, rgba(0,200,255,0.3), transparent 40%),
linear-gradient(120deg,#020617,#041a2d,#020617);
color:white;
}

/* NAVBAR */

.navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 40px;
background:rgba(5,23,46,0.85);
}

.logo{
font-size:26px;
font-weight:700;
color:#36f3ff;
}

/* LAYOUT */

.container{
display:flex;
}

/* SIDEBAR */

.sidebar{
width:250px;
min-height:100vh;
padding:25px;
background:rgba(6,20,40,0.75);
}

.sidebar h3{
margin-top:20px;
color:#5eead4;
}

.menu-card{
display:flex;
align-items:center;
gap:12px;
background:rgba(255,255,255,0.05);
padding:14px;
border-radius:14px;
margin-bottom:12px;
}

.menu-icon{
font-size:18px;
}

/* MAIN */

.main{
flex:1;
padding:60px;
}

.title{
text-align:center;
margin-bottom:40px;
}

.title h1{
font-size:44px;
color:#36f3ff;
}

/* FORM */

.form-box{

max-width:900px;
margin:auto;
padding:40px;
border-radius:22px;
background:rgba(255,255,255,0.06);
box-shadow:0 15px 40px rgba(0,0,0,0.7);

}

.form-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:25px;
}

.input-group label{
display:block;
margin-bottom:6px;
color:#67e8f9;
}

.input-group input,
.input-group select{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#0f172a;
color:white;
}

button{
margin-top:25px;
width:100%;
padding:16px;
border:none;
border-radius:14px;
font-size:18px;
font-weight:600;
cursor:pointer;
}

.guide-btn{
background:linear-gradient(120deg,#22c55e,#4ade80);
}

.pdf-btn{
background:#0ea5e9;
}

/* RESULT */

.result-card{

margin-top:30px;
padding:25px;
border-radius:15px;
background:rgba(255,255,255,0.08);
white-space:pre-line;

}

.result-card h3{
color:#36f3ff;
margin-bottom:10px;
}

</style>

<script>

/* WEEK DATABASE */

const babyDevelopment = {

1:"Baby is beginning development.",
4:"Tiny embryo forming.",
8:"Heartbeat detectable.",
12:"Organs forming.",
16:"Baby can move limbs.",
20:"Baby movements felt.",
22:"Facial features forming.",
24:"Baby responds to sound.",
28:"Eyes can open.",
32:"Rapid weight gain.",
36:"Preparing for birth.",
40:"Full term baby ready."

};


/* AI GUIDE */

function generateGuide(){

let age=parseInt(document.getElementById("age").value);
let week=parseInt(document.getElementById("week").value);
let health=document.getElementById("health").value;

let dev="Healthy baby development.";

if(babyDevelopment[week]){

dev=babyDevelopment[week];

}

let risk="Low Risk";

if(age>35 || health!=="None"){

risk="Moderate Risk – doctor monitoring recommended.";

}

if(age>40){

risk="High Risk Pregnancy – regular clinical supervision required.";

}

let length=(week*1.3).toFixed(1);
let weight=(week*22).toFixed(0);

let output=

"📅 WEEK "+week+" PREGNANCY GUIDE\n"+
"────────────────────────────\n\n"+

"🤱 Baby Development\n"+
"Baby length approx "+length+" cm\n"+
"Baby weight approx "+weight+" g\n"+
dev+"\n\n"+

"🥗 WHAT TO EAT\n"+
"• Iron rich foods (spinach, lentils)\n"+
"• Calcium (milk, yogurt, paneer)\n"+
"• Omega-3 (walnuts, flaxseeds)\n"+
"• Protein (eggs, dal, chickpeas)\n"+
"• Folate vegetables\n\n"+

"🚫 WHAT TO AVOID\n"+
"• Raw meat or eggs\n"+
"• Unpasteurised dairy\n"+
"• High mercury fish\n"+
"• Alcohol & smoking\n\n"+

"✅ WHAT TO DO\n"+
"• 30 min gentle walking\n"+
"• Prenatal yoga\n"+
"• Sleep on left side\n"+
"• Drink 8-10 glasses water\n\n"+

"⚠️ WHAT NOT TO DO\n"+
"• Avoid heavy lifting\n"+
"• Avoid intense workouts\n"+
"• Avoid standing long time\n\n"+

"🏥 UPCOMING TESTS\n"+
"• Ultrasound scan\n"+
"• Glucose tolerance test\n\n"+

"🧠 AI Risk Analysis: "+risk+"\n"+
"👩 Mother's Age: "+age+"\n"+
"⚠ Reported Health Issue: "+health;

document.getElementById("result").innerText=output;

}


/* PDF DOWNLOAD */

function downloadPDF(){

let text=document.getElementById("result").innerText;

let blob=new Blob([text],{type:"application/pdf"});

let link=document.createElement("a");

link.href=URL.createObjectURL(blob);

link.download="AI_Pregnancy_Report.pdf";

link.click();

}

</script>

</head>

<body>

<div class="navbar">
<div class="logo">CureGen</div>
</div>

<div class="container">

<div class="sidebar">

<h3>GUIDANCE</h3>

<div class="menu-card"><span class="menu-icon">🤰</span> Pregnancy Guide</div>
<div class="menu-card"><span class="menu-icon">👶</span> Newborn Health</div>
<div class="menu-card"><span class="menu-icon">🩺</span> BP Detection</div>
<div class="menu-card"><span class="menu-icon">🩸</span> Sugar Detection</div>

<h3>AUXILIARY</h3>

<div class="menu-card"><span class="menu-icon">🔐</span> Authentication</div>
<div class="menu-card"><span class="menu-icon">📄</span> PDF Reports</div>
<div class="menu-card"><span class="menu-icon">🏥</span> Top Hospitals</div>
<div class="menu-card"><span class="menu-icon">🤖</span> AI Assistant</div>

</div>

<div class="main">

<div class="title">
<h1>AI Pregnancy Guide</h1>
<p>Personalized pregnancy health insights</p>
</div>

<div class="form-box">

<div class="form-grid">

<div class="input-group">
<label>Mother's Age</label>
<input type="number" id="age">
</div>

<div class="input-group">
<label>Pregnancy Week</label>
<input type="number" id="week">
</div>

<div class="input-group">
<label>Health Issues</label>
<input type="text" id="health" placeholder="None">
</div>

<div class="input-group">
<label>First Pregnancy?</label>
<select>
<option>Yes</option>
<option>No</option>
</select>
</div>

</div>

<button class="guide-btn" onclick="generateGuide()">
✨ Get My Pregnancy Guide
</button>

<button class="pdf-btn" onclick="downloadPDF()">
📄 Download Medical PDF
</button>

<div class="result-card">

<h3>📊 AI Pregnancy Report</h3>

<div id="result">
Status: Awaiting patient input...
</div>

</div>

</div>

</div>

</div>

</body>
</html>
