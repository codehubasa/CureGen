<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>CureGen AI Chatbot</title>

<style>

body{
font-family:Segoe UI;
background:#020617;
}

.chat-btn{
position:fixed;
bottom:20px;
right:20px;
width:60px;
height:60px;
border-radius:50%;
background:linear-gradient(135deg,#00eaff,#22c55e);
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
box-shadow:0 12px 30px rgba(0,255,200,.6);
font-size:26px;
}

.chatbox{
position:fixed;
bottom:90px;
right:20px;
width:380px;
height:520px;
background:linear-gradient(160deg,#022c43,#0369a1,#16a34a);
border-radius:16px;
display:none;
flex-direction:column;
box-shadow:0 35px 80px rgba(0,0,0,.95);
}

.chat-header{
display:flex;
justify-content:space-between;
padding:14px;
font-weight:bold;
border-bottom:1px solid rgba(255,255,255,.2);
}

.chat-body{
flex:1;
padding:12px;
overflow-y:auto;
font-size:14px;
}

.message{margin:10px 0;}
.bot{color:#a7f3d0;}
.user{text-align:right;color:white;}

.chat-input{
display:flex;
border-top:1px solid rgba(255,255,255,.2);
}

.chat-input input{
flex:1;
padding:12px;
border:none;
background:#041a2d;
color:white;
outline:none;
}

.chat-input button{
padding:12px;
border:none;
background:#22c55e;
cursor:pointer;
}

</style>

</head>

<body>

<div class="chat-btn" onclick="toggleChat()">💬</div>

<div class="chatbox" id="chatbox">

<div class="chat-header">
CureGen Assistant
<span onclick="toggleChat()">✖</span>
</div>

<div class="chat-body" id="chatBody">

<div class="message bot">
👋 <b>Welcome to CureGen AI Assistant</b><br><br>

Enter a number or ask directly:<br><br>

1️⃣ Core Diagnostics<br>
2️⃣ Guidance System<br>
3️⃣ How CureGen Works<br>
4️⃣ Detection Methods<br>
5️⃣ Top Hospitals<br>
6️⃣ Reports & PDF<br>
0️⃣ Show Menu

</div>

</div>

<div class="chat-input">
<input id="userInput" placeholder="Type or enter number...">
<button onclick="sendMessage()">➤</button>
</div>

</div>

<script>

/* TOGGLE */
function toggleChat(){
let box=document.getElementById("chatbox");
box.style.display = box.style.display==="flex" ? "none" : "flex";
}

/* ENTER */
document.getElementById("userInput").addEventListener("keydown",function(e){
if(e.key==="Enter") sendMessage();
});

/* SEND */
function sendMessage(){

let input=document.getElementById("userInput");
let msg=input.value.trim().toLowerCase();

if(msg==="") return;

addMessage(msg,"user");
input.value="";

setTimeout(()=>{
addMessage("Typing...", "bot-temp");
},200);

setTimeout(()=>{
removeTyping();
let reply=getReply(msg);
addMessage(reply,"bot");
},800);

}

/* ADD MESSAGE */
function addMessage(text,type){

let div=document.createElement("div");

if(type==="bot-temp"){
div.id="typing";
div.className="message bot";
}else{
div.className="message "+type;
}

div.innerHTML=text;
document.getElementById("chatBody").appendChild(div);
document.getElementById("chatBody").scrollTop=9999;

}

/* REMOVE */
function removeTyping(){
let t=document.getElementById("typing");
if(t) t.remove();
}

/* ================= ULTRA DETAILED RESPONSES ================= */

function getReply(msg){

/* MAIN OPTIONS */

if(msg==="1")
return "🧠 <b>Core Diagnostics</b><br><br>\
CureGen provides AI-powered diagnostic systems designed for early detection of major diseases:<br><br>\
<b>• Brain Tumor Detection</b> – Uses MRI scans to identify abnormal brain tissues<br>\

👉 These systems help in faster diagnosis and better medical decisions.";

return "🫁 <b>Lung Disease Detection</b><br><br>\
Uses chest X-ray images to detect pneumonia and infections.<br><br>\
<b>Process:</b><br>\
• Image enhancement<br>\

Analyzes systolic and diastolic values.<br><br>\

• Fast AI-based analysis<br>\

</script>

</body>
</html>
